name: Build FieldPulse
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build-check:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - name: Install XcodeGen
        run: |
          brew untap aws/tap 2>/dev/null || true
          brew install xcodegen
      - name: Select latest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort | tail -1)"
      - name: Generate project
        env:
          PRODUCT_BUNDLE_IDENTIFIER_PREFIX: ${{ vars.PRODUCT_BUNDLE_IDENTIFIER_PREFIX || 'com.example' }}
        run: xcodegen generate
      - name: Inspect generated project
        run: xcodebuild -project FieldPulse.xcodeproj -list
      - name: Compile iOS without signing
        run: |
          set -o pipefail
          xcodebuild build -project FieldPulse.xcodeproj -scheme FieldPulse -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO -verbose 2>&1 | tee "$RUNNER_TEMP/build.log"
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: FieldPulse-build-log
          path: ${{ runner.temp }}/build.log

  sidestore-ipa:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - name: Install XcodeGen
        run: |
          brew untap aws/tap 2>/dev/null || true
          brew install xcodegen
      - name: Select latest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort | tail -1)"
      - name: Generate project
        env:
          PRODUCT_BUNDLE_IDENTIFIER_PREFIX: ${{ vars.PRODUCT_BUNDLE_IDENTIFIER_PREFIX || 'com.example' }}
        run: xcodegen generate
      - name: Build iPhone app for SideStore
        run: |
          set -o pipefail
          xcodebuild build -project FieldPulse.xcodeproj -scheme FieldPulseSideload -sdk iphoneos -configuration Release CONFIGURATION_BUILD_DIR="$RUNNER_TEMP/device-build" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO 2>&1 | tee "$RUNNER_TEMP/sidestore-build.log"
      - name: Package IPA
        run: |
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          ditto "$RUNNER_TEMP/device-build/FieldPulse.app" "$RUNNER_TEMP/ipa/Payload/FieldPulse.app"
          test -x "$RUNNER_TEMP/ipa/Payload/FieldPulse.app/FieldPulse"
          /usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$RUNNER_TEMP/ipa/Payload/FieldPulse.app/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$RUNNER_TEMP/ipa/Payload/FieldPulse.app/Info.plist"
          cd "$RUNNER_TEMP/ipa"
          /usr/bin/zip -qry "$RUNNER_TEMP/FieldPulse-SideStore.ipa" Payload
          /usr/bin/unzip -tq "$RUNNER_TEMP/FieldPulse-SideStore.ipa"
      - name: Upload SideStore files
        uses: actions/upload-artifact@v5
        with:
          name: FieldPulse-SideStore
          path: |
            ${{ runner.temp }}/FieldPulse-SideStore.ipa
            ${{ runner.temp }}/sidestore-build.log

  archive:
    if: ${{ vars.ENABLE_SIGNED_BUILD == 'true' }}
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - name: Install XcodeGen
        run: |
          brew untap aws/tap 2>/dev/null || true
          brew install xcodegen
      - name: Select installed Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort | tail -1)"
      - name: Generate project
        env:
          PRODUCT_BUNDLE_IDENTIFIER_PREFIX: ${{ vars.PRODUCT_BUNDLE_IDENTIFIER_PREFIX || 'com.example' }}
        run: xcodegen generate
      - name: Import signing certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/signing.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain-db
          echo -n "$CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "build" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "build" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
      - name: Install provisioning profiles
        env:
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
          WATCH_PROFILE_BASE64: ${{ secrets.WATCH_PROFILE_BASE64 }}
        run: |
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo -n "$IOS_PROFILE_BASE64" | base64 --decode > "$HOME/Library/MobileDevice/Provisioning Profiles/FieldPulse.mobileprovision"
          echo -n "$WATCH_PROFILE_BASE64" | base64 --decode > "$HOME/Library/MobileDevice/Provisioning Profiles/FieldPulseWatch.mobileprovision"
      - name: Archive
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild archive -project FieldPulse.xcodeproj -scheme FieldPulse -configuration Release -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/FieldPulse.xcarchive" DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Manual
      - name: Export IPA
        env:
          EXPORT_OPTIONS_BASE64: ${{ secrets.EXPORT_OPTIONS_BASE64 }}
        run: |
          echo -n "$EXPORT_OPTIONS_BASE64" | base64 --decode > "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/FieldPulse.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export"
      - uses: actions/upload-artifact@v5
        with:
          name: FieldPulse-iOS-archive
          path: |
            ${{ runner.temp }}/FieldPulse.xcarchive
            ${{ runner.temp }}/export/*.ipa
